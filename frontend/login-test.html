<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GymMaster Auth Test</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: #f4f6f8; color: #17202a; padding: 24px; }
    main { max-width: 1120px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    p { margin: 0 0 20px; color: #5d6d7e; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    section { background: #fff; border: 1px solid #dce3ea; border-radius: 8px; padding: 20px; box-shadow: 0 10px 24px rgba(18, 38, 63, 0.07); }
    h2 { margin: 0 0 14px; font-size: 18px; }
    label { display: block; margin: 12px 0 6px; font-weight: 700; font-size: 14px; }
    input { width: 100%; height: 42px; border: 1px solid #c8d2dc; border-radius: 6px; padding: 0 12px; font-size: 14px; }
    button { min-height: 42px; margin-top: 16px; border: 0; border-radius: 6px; background: #1f7a5f; color: #fff; padding: 0 16px; font-size: 14px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #2f5f98; }
    button.danger { background: #9f3a38; }
    button:disabled { background: #8ca79e; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .wide { grid-column: 1 / -1; }
    .result { margin-top: 16px; background: #111827; color: #d1fae5; border-radius: 8px; padding: 16px; }
    pre { margin: 0; min-height: 220px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>GymMaster Auth Test</h1>
    <p>Trang test backend auth đầy đủ: login, register, refresh, logout, me, forgot/reset/change password, Google.</p>

    <div class="grid">
      <section>
        <h2>Login</h2>
        <label>Email</label>
        <input id="loginEmail" type="email" value="admin@gymmaster.local">
        <label>Mat khau</label>
        <input id="loginPassword" type="password" value="Admin123!">
        <button data-action="login">Login</button>
      </section>

      <section>
        <h2>Register</h2>
        <label>Ho ten</label>
        <input id="registerFullName" value="Nguyen Van Member">
        <label>Email</label>
        <input id="registerEmail" type="email" value="member1@gymmaster.local">
        <label>So dien thoai</label>
        <input id="registerPhone" value="0900000001">
        <label>Mat khau</label>
        <input id="registerPassword" type="password" value="Member123!">
        <button data-action="register">Register</button>
      </section>

      <section>
        <h2>Forgot password</h2>
        <label>Email</label>
        <input id="forgotEmail" type="email" value="member1@gymmaster.local">
        <button data-action="forgot">Create reset token</button>
      </section>

      <section>
        <h2>Reset password</h2>
        <label>Email</label>
        <input id="resetEmail" type="email" value="member1@gymmaster.local">
        <label>Reset token</label>
        <input id="resetToken" placeholder="Token sẽ tự điền sau forgot-password">
        <label>Mat khau moi</label>
        <input id="resetNewPassword" type="password" value="Member456!">
        <button data-action="reset">Reset password</button>
      </section>

      <section>
        <h2>Change password</h2>
        <label>Mat khau hien tai</label>
        <input id="changeCurrentPassword" type="password" value="Member123!">
        <label>Mat khau moi</label>
        <input id="changeNewPassword" type="password" value="Member456!">
        <button data-action="change-password">Change password</button>
      </section>

      <section>
        <h2>Token actions</h2>
        <div class="actions">
          <button class="secondary" data-action="me">GET /me</button>
          <button class="secondary" data-action="refresh">Refresh</button>
          <button class="danger" data-action="logout">Logout</button>
          <button class="danger" data-action="clear">Clear local token</button>
        </div>
      </section>

      <section>
        <h2>Google login</h2>
        <label>Google ID token</label>
        <input id="googleIdToken" placeholder="Cần Google ClientId và ID token thật">
        <button data-action="google">Google login</button>
      </section>

      <section class="wide">
        <h2>Ket qua</h2>
        <p id="tokenStatus">Chua co token trong localStorage.</p>
        <div class="result"><pre id="result">Ket qua se hien o day.</pre></div>
      </section>
    </div>
  </main>

  <script>
    const apiBaseUrl = "http://localhost:5042";
    const result = document.querySelector("#result");
    const tokenStatus = document.querySelector("#tokenStatus");

    const store = {
      get accessToken() { return localStorage.getItem("gymmaster_access_token"); },
      set accessToken(value) { localStorage.setItem("gymmaster_access_token", value); },
      get refreshToken() { return localStorage.getItem("gymmaster_refresh_token"); },
      set refreshToken(value) { localStorage.setItem("gymmaster_refresh_token", value); },
      clear() {
        localStorage.removeItem("gymmaster_access_token");
        localStorage.removeItem("gymmaster_refresh_token");
      }
    };

    function updateTokenStatus() {
      tokenStatus.textContent = store.accessToken
        ? "Dang co accessToken va refreshToken trong localStorage."
        : "Chua co token trong localStorage.";
    }

    function show(data) {
      result.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      updateTokenStatus();
    }

    async function request(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...options.headers };
      if (options.auth && store.accessToken) headers.Authorization = `Bearer ${store.accessToken}`;

      const response = await fetch(`${apiBaseUrl}${path}`, { ...options, headers });
      if (response.status === 204) return { status: 204, body: { success: true, data: "No Content" } };

      const text = await response.text();
      const body = text ? JSON.parse(text) : null;
      if (!response.ok) throw new Error(`HTTP ${response.status}: ${JSON.stringify(body, null, 2)}`);
      return { status: response.status, body };
    }

    function saveTokens(apiResponse) {
      const data = apiResponse.data;
      if (data?.accessToken) store.accessToken = data.accessToken;
      if (data?.refreshToken) store.refreshToken = data.refreshToken;
    }

    const actions = {
      async login() {
        const { body } = await request("/api/v1/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.querySelector("#loginEmail").value,
            password: document.querySelector("#loginPassword").value
          })
        });
        saveTokens(body);
        show(body);
      },
      async register() {
        const { body } = await request("/api/v1/auth/register", {
          method: "POST",
          body: JSON.stringify({
            fullName: document.querySelector("#registerFullName").value,
            email: document.querySelector("#registerEmail").value,
            phone: document.querySelector("#registerPhone").value,
            password: document.querySelector("#registerPassword").value
          })
        });
        saveTokens(body);
        show(body);
      },
      async forgot() {
        const { body } = await request("/api/v1/auth/forgot-password", {
          method: "POST",
          body: JSON.stringify({ email: document.querySelector("#forgotEmail").value })
        });
        if (body.data?.resetToken) document.querySelector("#resetToken").value = body.data.resetToken;
        show(body);
      },
      async reset() {
        const { body } = await request("/api/v1/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({
            email: document.querySelector("#resetEmail").value,
            resetToken: document.querySelector("#resetToken").value,
            newPassword: document.querySelector("#resetNewPassword").value
          })
        });
        show(body);
      },
      async "change-password"() {
        const { body } = await request("/api/v1/auth/change-password", {
          method: "POST",
          auth: true,
          body: JSON.stringify({
            currentPassword: document.querySelector("#changeCurrentPassword").value,
            newPassword: document.querySelector("#changeNewPassword").value
          })
        });
        show(body);
      },
      async me() {
        const { body } = await request("/api/v1/auth/me", { method: "GET", auth: true });
        show(body);
      },
      async refresh() {
        const { body } = await request("/api/v1/auth/refresh", {
          method: "POST",
          body: JSON.stringify({ refreshToken: store.refreshToken })
        });
        saveTokens(body);
        show(body);
      },
      async logout() {
        const { body } = await request("/api/v1/auth/logout", { method: "POST", auth: true });
        store.clear();
        show(body);
      },
      clear() {
        store.clear();
        show("Da xoa token local.");
      },
      async google() {
        const { body } = await request("/api/v1/auth/google", {
          method: "POST",
          body: JSON.stringify({ idToken: document.querySelector("#googleIdToken").value })
        });
        saveTokens(body);
        show(body);
      }
    };

    document.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const action = actions[button.dataset.action];
      if (!action) return;

      button.disabled = true;
      result.textContent = "Dang goi API...";
      try {
        await action();
      } catch (error) {
        show(error.message);
      } finally {
        button.disabled = false;
      }
    });

    updateTokenStatus();
  </script>
</body>
</html>
